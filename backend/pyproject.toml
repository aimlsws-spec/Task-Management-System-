[project]
name = "task-management-backend"
version = "0.1.0"
description = "Employee Task Assignment, Monitoring & Management System - API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "a2wsgi>=1.10",  # cPanel/Passenger: runs the FastAPI app under WSGI
  "uvicorn>=0.30",  # local development only (not needed on cPanel)
  "sqlalchemy>=2.0.30",
  "pymysql>=1.1",
  "cryptography>=42",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "hypothesis>=6.100", "aiosmtpd>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.setuptools.packages.find]
include = ["app*"]
